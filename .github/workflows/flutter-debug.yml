name: Development Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

# One development build per branch at a time. Cancelled on a newer push: an
# older build is superseded the moment the next commit lands, and publishing it
# after would put a stale APK behind the "Latest" badge.
concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

# Set once, at the top, so the Android APKs and the Windows zip out of one push
# carry the same build number rather than one each.
env:
  KYRON_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  version:
    name: Read the version and describe the build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the notes below can list what has landed
          # since the previous development build.
          fetch-depth: 0

      - name: Read app version
        id: version
        working-directory: app
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every one of these releases shipped with an empty body, so the releases
      # page was thirty-odd identically-titled builds with no way to tell what
      # was in any of them.
      - name: Describe what is in this build
        id: notes
        run: |
          set -euo pipefail
          # Not piped to `head`: under `pipefail`, head exiting early sends
          # git SIGPIPE and fails the step.
          tags=$(git tag --list 'debug-*' --sort=-creatordate)
          previous=${tags%%$'\n'*}
          if [ -n "$previous" ]; then
            range="${previous}..HEAD"
            header="Changes since \`${previous}\`:"
          else
            range=HEAD
            header="Commits in this build:"
          fi

          {
            echo 'notes<<KYRON_NOTES_EOF'
            echo "$header"
            echo
            git log --no-merges -n 40 --pretty='- %s (`%h`)' "$range"
            echo
            echo "Built from \`$(git rev-parse --short HEAD)\`."
            echo 'KYRON_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  android:
    name: Build the Android development APKs
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned rather than left to whatever the runner image ships. The Android
      # Gradle Plugin and Kotlin target 17 (app/android/app/build.gradle.kts).
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release mode, like the Windows half below, and for the same reason
      # stated differently: a development build has to be one the people it is
      # for can actually run.
      #
      # `--debug` produced an APK that would not install. Two things were
      # wrong with it and release mode fixes both. It carried
      # `android:debuggable="true"`, which ColorOS, MIUI, Funtouch and several
      # other OEM skins refuse outright from an unknown source -- the message
      # they show is "App not installed as package appears to be invalid",
      # which sounds like a corrupt file and is not. And it was enormous:
      # 114 MB for arm64 and 190 MB universal, because a Flutter debug APK
      # carries the Dart kernel for the JIT (87 MB of `kernel_blob.bin`), the
      # debug engine (39 MB of `libflutter.so`) and 15 MB of Vulkan validation
      # layers that exist only in debug. Over a phone connection that is a
      # download long enough to truncate, and a truncated APK fails with that
      # same message.
      #
      # The signing key is written below, and it has to be, because the
      # absence of one is what made "package appears to be invalid" come
      # back after this workflow was already building in release mode.
      #
      # With no `key.properties`, `buildTypes.release` falls back to
      # `signingConfigs.debug` -- and on a fresh runner there is no
      # `~/.android/debug.keystore`, so Gradle mints a brand new one. Every
      # development build was therefore signed with a *different* key:
      #
      #   build 74  CN=Android Debug  notBefore Sep 13 12:48:15 2026
      #   build 75  CN=Android Debug  notBefore Sep 13 18:12:08 2026
      #
      # Each certificate created during its own build, minutes before it
      # signed the APK. Android refuses to install a package whose signature
      # does not match the one already installed -- that is
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE -- and the package installers on
      # ColorOS, MIUI and Funtouch report it as "App not installed as package
      # appears to be invalid". Same words as the debuggable failure, entirely
      # different cause, and it strikes on the *second* install rather than
      # the first, which is why it reads as intermittent.
      #
      # Two builds, because --split-per-abi replaces the universal APK rather
      # than adding to it.
      # Optional here, unlike the release. A development APK without push is
      # still worth having, and this is what a contributor's own checkout
      # looks like -- the Gradle plugin is skipped and the build says so.
      # One key for every development build, so build N+1 installs over
      # build N instead of being refused.
      #
      # `ANDROID_DEV_KEYSTORE_BASE64` if it is set, so development builds can
      # have a key of their own; otherwise the release key, so this works
      # today without anybody creating a second secret. Taken as a set rather
      # than field by field -- half of one keystore and half of another is a
      # build failure with a confusing message.
      #
      # With neither -- which is the state this repository is actually in --
      # the key committed at app/android/dev-signing/. There is always a key.
      # A build signed with one nobody has seen before is a build nobody can
      # install, and "set a secret first" is not an answer a fork can use.
      - name: Write the signing key
        working-directory: .
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          DEV_STORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$DEV_KEYSTORE" ]; then
            which=development
            keystore=$DEV_KEYSTORE
            store_password=$DEV_STORE_PASSWORD
            key_password=$DEV_KEY_PASSWORD
            key_alias=$DEV_KEY_ALIAS
          elif [ -n "$RELEASE_KEYSTORE" ]; then
            which=release
            keystore=$RELEASE_KEYSTORE
            store_password=$RELEASE_STORE_PASSWORD
            key_password=$RELEASE_KEY_PASSWORD
            key_alias=$RELEASE_KEY_ALIAS
          else
            # The key in the repository. Not a fallback to nothing: there is
            # always a key, because a build signed with a key nobody has seen
            # before is a build nobody can install.
            #
            # app/android/dev-signing/README.md is the argument for committing
            # it, including why it is safe and why that does not generalise.
            which="committed development"
            keystore=
            store_password=kyron-development
            key_password=kyron-development
            key_alias=kyron-dev
          fi

          if [ -n "$keystore" ]; then
            printf '%s' "$keystore" | base64 --decode > app/android/dev-keystore.jks
            store_file=../dev-keystore.jks
            echo "KYRON_PINNED=no" >> "$GITHUB_ENV"
          else
            store_file=../dev-signing/kyron-dev.jks
            # Only the committed key has a fingerprint this repository knows,
            # so only then can the check below compare against it.
            echo "KYRON_PINNED=yes" >> "$GITHUB_ENV"
          fi

          cat > app/android/key.properties <<EOF
          storePassword=$store_password
          keyPassword=$key_password
          keyAlias=$key_alias
          storeFile=$store_file
          EOF
          echo "KYRON_SIGNED=yes" >> "$GITHUB_ENV"
          echo "Signing with the $which key."

      - name: Write the Firebase configuration
        working-directory: .
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json
            echo "Firebase configured: this build can receive notifications."
          else
            echo "No GOOGLE_SERVICES_JSON secret, so this build has no push."
          fi

      - name: Build per-architecture APKs
        env:
          # Optional. supabase_config.dart carries a committed default; this
          # lets a build override it without one being in the repository. The
          # publishable key is safe to commit -- what was not safe was the
          # wrong project's key being committed, which is why the app now
          # refuses to launch rather than reach a Supabase it was not meant to.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-number "$KYRON_BUILD_NUMBER" \
            ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"}

      # Collected before the universal build runs: both write into the same
      # flutter-apk directory, and the second build is not obliged to leave the
      # first one's output there.
      - name: Collect per-architecture APKs
        working-directory: .
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p debug-artifacts
          stem="kyron-${VERSION}+${KYRON_BUILD_NUMBER}-dev"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            # Missing means the split build did not produce it, which is a
            # broken build rather than a smaller one.
            test -f "$src" || { echo "Missing $src"; exit 1; }
            cp "$src" "debug-artifacts/${stem}-${abi}.apk"
          done

      - name: Build the universal APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --build-number "$KYRON_BUILD_NUMBER" \
            ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"}

      - name: Collect the universal APK
        working-directory: .
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cp app/build/app/outputs/flutter-apk/app-release.apk \
            "debug-artifacts/kyron-${VERSION}+${KYRON_BUILD_NUMBER}-dev-universal.apk"
          ls -lh debug-artifacts

      # The checks that would have caught each of these. An APK that is
      # debuggable, or enormous, or signed with a key nobody has seen before
      # builds, uploads and publishes perfectly happily, and then will not
      # install -- and every one of those three shows the reader the same six
      # words, "package appears to be invalid", which point at the file rather
      # than at the cause.
      #
      # The checking is in scripts/check-apks.sh, called by the release
      # workflow too: a check that guards development builds and not releases
      # is one that will be missing the day it matters. What it does and why
      # each part of it is there is written at the top of that file.
      - name: Check the APKs are installable
        working-directory: .
        run: |
          set -euo pipefail
          # Pinned to the key committed at app/android/dev-signing, when that
          # is the key in use: it is the only one whose fingerprint this
          # repository knows. A secret keystore has nothing here to pin to,
          # and everything else about the check still applies.
          if [ "${KYRON_PINNED:-no}" = yes ]; then
            pin=$(tr -d '[:space:]' < app/android/dev-signing/fingerprint.txt)
            test -n "$pin" || {
              echo "app/android/dev-signing/fingerprint.txt is empty."
              exit 1
            }
            scripts/check-apks.sh --pin "$pin" debug-artifacts/*.apk
          else
            scripts/check-apks.sh debug-artifacts/*.apk
          fi

      - name: Hand the Android build to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: debug-artifacts/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build the Windows development app
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release mode: `flutter build windows --debug` links against the
      # Visual C++ *debug* runtime -- ucrtbased.dll, vcruntime140d.dll --
      # which ships with Visual Studio and not with Windows. A debug zip
      # therefore fails to start on the machine of anyone who does not develop
      # on it, which is everyone this build is for.
      #
      # This comment used to end "Android has no equivalent problem, so its
      # APKs stay debug." Android had exactly the equivalent problem, and the
      # APKs would not install. Both halves are release builds now.
      - name: Build the Windows app
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A plain array passed to a native command, which PowerShell expands
          # one element per argument. Not splatted with @: that is for cmdlets,
          # and only recent PowerShell extends it to native commands. Not
          # $args either -- that name is already PowerShell's.
          $flags = @('--release', '--build-number', $env:KYRON_BUILD_NUMBER)
          if ($env:SUPABASE_ANON_KEY) {
            $flags += "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY"
          }
          flutter build windows $flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A Windows app is a folder, not a file: the executable needs
      # flutter_windows.dll, every plugin's DLL and the whole data directory
      # beside it. The zip carries the folder, with a name inside it, because
      # unzipping a bare pile of DLLs into Downloads ends badly.
      - name: Package the Windows app
        working-directory: .
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          & ./scripts/package-windows.ps1 `
            -Stem "kyron-$env:VERSION+$env:KYRON_BUILD_NUMBER-dev" `
            -OutputDirectory debug-artifacts

      - name: Hand the Windows build to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: debug-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the development build
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Collect both platforms
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Gather them into one directory
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p debug-artifacts
          find incoming -type f -exec mv {} debug-artifacts/ \;
          ls -lh debug-artifacts

          # Both platforms, or it is not this build.
          stem="kyron-${VERSION}+${KYRON_BUILD_NUMBER}-dev"
          test -f "debug-artifacts/${stem}-windows-x64.zip"
          test -f "debug-artifacts/${stem}-arm64-v8a.apk"

      # Published as a normal release, not a prerelease: GitHub's "Latest"
      # badge and /releases/latest only ever consider non-prereleases, so while
      # every build was a prerelease the endpoint returned 404 and no build ever
      # showed as current. make_latest is explicit because tag names sort
      # lexicographically -- debug-0.1.0-9 sorts after debug-0.1.0-20.
      #
      # Once a versioned release exists this should become prerelease: true,
      # so that "Latest" means the shipped build rather than the newest commit.
      - name: Publish development release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ needs.version.outputs.version }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Kyron ${{ needs.version.outputs.version }} development build ${{ github.run_number }}
          body: |
            ${{ needs.version.outputs.notes }}

            ---

            A development build off `main`, not a release. Both halves are
            compiled in release mode; only the signature is a development one.

            **Windows** — `*-windows-x64.zip`. Unzip anywhere and run
            `Kyron.exe` inside the `Kyron` folder; keep the folder together.
            Windows will warn that the publisher is unknown, because the build
            is not code-signed.

            **Android** — take `arm64-v8a` unless you know otherwise; it fits
            essentially every phone sold since about 2015. `universal` works
            anywhere and is roughly three times the size. `x86_64` is for
            emulators.

            These are signed with a development key, not the store key, so a
            build from here and a build from the Play Store cannot sit side by
            side: uninstall one before installing the other. If Android says
            *"App not installed as package appears to be invalid"*, that is
            almost always an interrupted download — check the file is the full
            size shown here and try again on a stable connection.
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: debug-artifacts/*
