name: Development Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

# One development build per branch at a time. Cancelled on a newer push: an
# older build is superseded the moment the next commit lands, and publishing it
# after would put a stale APK behind the "Latest" badge.
concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

# Set once, at the top, so the Android APKs and the Windows zip out of one push
# carry the same build number rather than one each.
env:
  KYRON_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  version:
    name: Read the version and describe the build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the notes below can list what has landed
          # since the previous development build.
          fetch-depth: 0

      - name: Read app version
        id: version
        working-directory: app
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every one of these releases shipped with an empty body, so the releases
      # page was thirty-odd identically-titled builds with no way to tell what
      # was in any of them.
      - name: Describe what is in this build
        id: notes
        run: |
          set -euo pipefail
          # Not piped to `head`: under `pipefail`, head exiting early sends
          # git SIGPIPE and fails the step.
          tags=$(git tag --list 'debug-*' --sort=-creatordate)
          previous=${tags%%$'\n'*}
          if [ -n "$previous" ]; then
            range="${previous}..HEAD"
            header="Changes since \`${previous}\`:"
          else
            range=HEAD
            header="Commits in this build:"
          fi

          {
            echo 'notes<<KYRON_NOTES_EOF'
            echo "$header"
            echo
            git log --no-merges -n 40 --pretty='- %s (`%h`)' "$range"
            echo
            echo "Built from \`$(git rev-parse --short HEAD)\`."
            echo 'KYRON_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  android:
    name: Build the Android development APKs
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned rather than left to whatever the runner image ships. The Android
      # Gradle Plugin and Kotlin target 17 (app/android/app/build.gradle.kts).
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Two builds, because --split-per-abi replaces the universal APK rather
      # than adding to it.
      # Optional here, unlike the release. A development APK without push is
      # still worth having, and this is what a contributor's own checkout
      # looks like -- the Gradle plugin is skipped and the build says so.
      - name: Write the Firebase configuration
        working-directory: .
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json
            echo "Firebase configured: this build can receive notifications."
          else
            echo "No GOOGLE_SERVICES_JSON secret, so this build has no push."
          fi

      - name: Build per-architecture debug APKs
        env:
          # Optional. supabase_config.dart carries a committed default; this
          # lets a build override it without one being in the repository. The
          # publishable key is safe to commit -- what was not safe was the
          # wrong project's key being committed, which is why the app now
          # refuses to launch rather than reach a Supabase it was not meant to.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug --split-per-abi \
            --build-number "$KYRON_BUILD_NUMBER" \
            ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"}

      # Collected before the universal build runs: both write into the same
      # flutter-apk directory, and the second build is not obliged to leave the
      # first one's output there.
      - name: Collect per-architecture APKs
        working-directory: .
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p debug-artifacts
          stem="kyron-${VERSION}+${KYRON_BUILD_NUMBER}-debug"

          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/app/outputs/flutter-apk/app-${abi}-debug.apk"
            # Missing means the split build did not produce it, which is a
            # broken build rather than a smaller one.
            test -f "$src" || { echo "Missing $src"; exit 1; }
            cp "$src" "debug-artifacts/${stem}-${abi}.apk"
          done

      - name: Build universal debug APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug \
            --build-number "$KYRON_BUILD_NUMBER" \
            ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"}

      - name: Collect the universal APK
        working-directory: .
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cp app/build/app/outputs/flutter-apk/app-debug.apk \
            "debug-artifacts/kyron-${VERSION}+${KYRON_BUILD_NUMBER}-debug-universal.apk"
          ls -lh debug-artifacts

      - name: Hand the Android build to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: debug-artifacts/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build the Windows development app
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release mode, on a workflow whose Android half is debug, and that is
      # deliberate: `flutter build windows --debug` links against the Visual
      # C++ *debug* runtime -- ucrtbased.dll, vcruntime140d.dll -- which ships
      # with Visual Studio and not with Windows. A debug zip therefore fails to
      # start on the machine of anyone who does not develop on it, which is
      # everyone this build is for. Android has no equivalent problem, so its
      # APKs stay debug.
      - name: Build the Windows app
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A plain array passed to a native command, which PowerShell expands
          # one element per argument. Not splatted with @: that is for cmdlets,
          # and only recent PowerShell extends it to native commands. Not
          # $args either -- that name is already PowerShell's.
          $flags = @('--release', '--build-number', $env:KYRON_BUILD_NUMBER)
          if ($env:SUPABASE_ANON_KEY) {
            $flags += "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY"
          }
          flutter build windows $flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A Windows app is a folder, not a file: the executable needs
      # flutter_windows.dll, every plugin's DLL and the whole data directory
      # beside it. The zip carries the folder, with a name inside it, because
      # unzipping a bare pile of DLLs into Downloads ends badly.
      - name: Package the Windows app
        working-directory: .
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          & ./scripts/package-windows.ps1 `
            -Stem "kyron-$env:VERSION+$env:KYRON_BUILD_NUMBER-debug" `
            -OutputDirectory debug-artifacts

      - name: Hand the Windows build to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: debug-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the development build
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Collect both platforms
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Gather them into one directory
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p debug-artifacts
          find incoming -type f -exec mv {} debug-artifacts/ \;
          ls -lh debug-artifacts

          # Both platforms, or it is not this build.
          stem="kyron-${VERSION}+${KYRON_BUILD_NUMBER}-debug"
          test -f "debug-artifacts/${stem}-windows-x64.zip"
          test -f "debug-artifacts/${stem}-arm64-v8a.apk"

      # Published as a normal release, not a prerelease: GitHub's "Latest"
      # badge and /releases/latest only ever consider non-prereleases, so while
      # every build was a prerelease the endpoint returned 404 and no build ever
      # showed as current. make_latest is explicit because tag names sort
      # lexicographically -- debug-0.1.0-9 sorts after debug-0.1.0-20.
      #
      # Once a versioned release exists this should become prerelease: true,
      # so that "Latest" means the shipped build rather than the newest commit.
      - name: Publish development release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ needs.version.outputs.version }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Kyron ${{ needs.version.outputs.version }} development build ${{ github.run_number }}
          body: |
            ${{ needs.version.outputs.notes }}

            ---

            A development build off `main`, not a release.

            **Windows** — `*-windows-x64.zip`. Unzip anywhere and run
            `Kyron.exe` inside the `Kyron` folder; keep the folder together.
            Windows will warn that the publisher is unknown, because the build
            is not code-signed. This half is compiled in release mode: a debug
            Windows build needs the Visual C++ debug runtime, which only
            machines with Visual Studio have.

            **Android** — debug APKs. `arm64-v8a` suits any phone from roughly
            2015 onwards; the `universal` APK works everywhere and is about
            three times the size.
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: debug-artifacts/*
