name: Development Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-debug.yml'
  workflow_dispatch:

# Read-only by default. The Android job publishes its validated files
# directly to GitHub Releases, avoiding temporary Actions artifact storage.
# Only that job needs contents: write; checkout does not persist the token.
permissions:
  contents: read

# Keep an active build alive. Cancelling a Gradle process on every newer push
# sends SIGTERM (143) through Flutter/Gradle and turns a recoverable queue into
# a failed run. GitHub retains only the newest pending run in this concurrency
# group; the running build completes before that pending build starts.
concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: false

# The build number is worked out once, in the first job, and every job after
# it reads that one answer -- so the APKs and bundle out of one push carry the same number. It is the commit count,
# shared with the Release workflow: scripts/build-number.sh says why.

jobs:
  version:
    name: Read the version and describe the build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.build.outputs.build }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, so the notes below can list what has landed
          # since the previous development build.
          fetch-depth: 0

      - name: Read app version
        id: version
        working-directory: app
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The same number Release gives a tag, counted the same way, so one
      # sequence runs through both and a bundle from either is above every
      # bundle from before it. The full history fetched above is what lets
      # it count.
      - name: Number the build
        id: build
        run: echo "build=$(scripts/build-number.sh)" >> "$GITHUB_OUTPUT"

      # Every one of these releases shipped with an empty body, so the releases
      # page was thirty-odd identically-titled builds with no way to tell what
      # was in any of them.
      - name: Describe what is in this build
        id: notes
        run: |
          set -euo pipefail
          # Not piped to `head`: under `pipefail`, head exiting early sends
          # git SIGPIPE and fails the step.
          tags=$(git tag --list 'debug-*' --sort=-creatordate)
          previous=${tags%%$'\n'*}
          if [ -n "$previous" ]; then
            range="${previous}..HEAD"
            header="Changes since \`${previous}\`:"
          else
            range=HEAD
            header="Commits in this build:"
          fi

          {
            echo 'notes<<KYRON_NOTES_EOF'
            echo "$header"
            echo
            git log --no-merges -n 40 --pretty='- %s (`%h`)' "$range"
            echo
            echo "Built from \`$(git rev-parse --short HEAD)\`."
            echo 'KYRON_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  android:
    name: Build, validate and publish the development APKs and Play bundle
    needs: version
    # Avoid an unreviewed Android host-image upgrade via ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      KYRON_BUILD_NUMBER: ${{ needs.version.outputs.build }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned rather than left to whatever the runner image ships. The Android
      # Gradle Plugin and Kotlin target 17 (app/android/app/build.gradle.kts).
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle*
            app/android/gradle.properties
            app/android/gradle/wrapper/gradle-wrapper.properties
            app/pubspec.lock

      - name: Configure Android CI resource budget
        working-directory: .
        run: scripts/android-ci.sh configure

      # Before anything Gradle runs, and in its own step. Left to the build,
      # the NDK was downloaded twelve minutes into `flutter build` -- two of
      # them, one per version a module named -- and Release 19 failed there on
      # a corrupt download. scripts/install-ndk.sh installs the one version the
      # build uses, and tries again when a download fails.
      #
      # From the repository root: this job runs in app/ by default, and the
      # first version of this step looked for app/scripts/install-ndk.sh.
      - name: Install the NDK
        working-directory: .
        run: scripts/install-ndk.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned, not "whatever stable shipped last night": Flutter 3.50
          # raised Flutter's minimum Gradle to 9.3.1, and this project's
          # wrapper is on 8.14 (app/android/gradle/wrapper), where every
          # Android build dies applying the Flutter Gradle plugin at
          # `flutter build`. Move this pin and the Android toolchain
          # (gradle-wrapper.properties, AGP and Kotlin in settings.gradle.kts)
          # up together, never apart.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release mode: a development build has to be one the people it is for
      # can actually run.
      #
      # `--debug` produced an APK that would not install. Two things were
      # wrong with it and release mode fixes both. It carried
      # `android:debuggable="true"`, which ColorOS, MIUI, Funtouch and several
      # other OEM skins refuse outright from an unknown source -- the message
      # they show is "App not installed as package appears to be invalid",
      # which sounds like a corrupt file and is not. And it was enormous:
      # 114 MB for arm64 and 190 MB universal, because a Flutter debug APK
      # carries the Dart kernel for the JIT (87 MB of `kernel_blob.bin`), the
      # debug engine (39 MB of `libflutter.so`) and 15 MB of Vulkan validation
      # layers that exist only in debug. Over a phone connection that is a
      # download long enough to truncate, and a truncated APK fails with that
      # same message.
      #
      # The signing key is written below, and it has to be, because the
      # absence of one is what made "package appears to be invalid" come
      # back after this workflow was already building in release mode.
      #
      # With no `key.properties`, `buildTypes.release` falls back to
      # `signingConfigs.debug` -- and on a fresh runner there is no
      # `~/.android/debug.keystore`, so Gradle mints a brand new one. Every
      # development build was therefore signed with a *different* key:
      #
      #   build 74  CN=Android Debug  notBefore Sep 13 12:48:15 2026
      #   build 75  CN=Android Debug  notBefore Sep 13 18:12:08 2026
      #
      # Each certificate created during its own build, minutes before it
      # signed the APK. Android refuses to install a package whose signature
      # does not match the one already installed -- that is
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE -- and the package installers on
      # ColorOS, MIUI and Funtouch report it as "App not installed as package
      # appears to be invalid". Same words as the debuggable failure, entirely
      # different cause, and it strikes on the *second* install rather than
      # the first, which is why it reads as intermittent.
      #
      # And a third cause, found the same way: `--split-per-abi` gave each APK
      # in a build a different versionCode, so the second file anybody tried
      # was refused as a downgrade -- again in those six words. The builds
      # below are one architecture at a time for that reason.
      # Optional here, unlike the release. A development APK without push is
      # still worth having, and this is what a contributor's own checkout
      # looks like -- the Gradle plugin is skipped and the build says so.
      # One key for every development build, so build N+1 installs over
      # build N instead of being refused.
      #
      # `ANDROID_DEV_KEYSTORE_BASE64` if it is set, so development builds can
      # have a key of their own, taken as a set rather than field by field --
      # half of one keystore and half of another is a build failure with a
      # confusing message.
      #
      # Never the release key. That is the Play upload key, and it used to be
      # the fallback here: so adding it as a secret, to publish to Play, would
      # quietly re-sign every development build with it, and every phone
      # carrying the last one would refuse the next as a different app until
      # it was uninstalled. The upload key signs what goes to Play and nothing
      # else -- here, the bundle built after the APKs, which is not installed
      # by hand.
      #
      # Without a development key -- which is the state this repository is
      # actually in -- the key committed at app/android/dev-signing/. There is
      # always a key.
      # A build signed with one nobody has seen before is a build nobody can
      # install, and "set a secret first" is not an answer a fork can use.
      - name: Write the signing key
        working-directory: .
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          DEV_STORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$DEV_KEYSTORE" ]; then
            which=development
            keystore=$DEV_KEYSTORE
            store_password=$DEV_STORE_PASSWORD
            key_password=$DEV_KEY_PASSWORD
            key_alias=$DEV_KEY_ALIAS
          else
            # The key in the repository. Not a fallback to nothing: there is
            # always a key, because a build signed with a key nobody has seen
            # before is a build nobody can install.
            #
            # app/android/dev-signing/README.md is the argument for committing
            # it, including why it is safe and why that does not generalise.
            which="committed development"
            keystore=
            store_password=kyron-development
            key_password=kyron-development
            key_alias=kyron-dev
          fi

          if [ -n "$keystore" ]; then
            printf '%s' "$keystore" | base64 --decode > app/android/dev-keystore.jks
            store_file=../dev-keystore.jks
            echo "KYRON_PINNED=no" >> "$GITHUB_ENV"
          else
            store_file=../dev-signing/kyron-dev.jks
            # Only the committed key has a fingerprint this repository knows,
            # so only then can the check below compare against it.
            echo "KYRON_PINNED=yes" >> "$GITHUB_ENV"
          fi

          cat > app/android/key.properties <<EOF
          storePassword=$store_password
          keyPassword=$key_password
          keyAlias=$key_alias
          storeFile=$store_file
          EOF
          echo "KYRON_SIGNED=yes" >> "$GITHUB_ENV"
          echo "Signing with the $which key."

      - name: Write the Firebase configuration
        working-directory: .
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json
            echo "Firebase configured: this build can receive notifications."
          else
            echo "No GOOGLE_SERVICES_JSON secret, so this build has no push."
          fi

      # Build all three ABI-specific APKs together. Flutter's explicit
      # force-version-code-ignoring-abi property keeps the same versionCode
      # on every APK, so switching downloads is not a downgrade. Build the
      # universal APK separately; the SDK/toolchain can reuse prior work.
      - name: Build every APK
        working-directory: .
        env:
          # Optional. supabase_config.dart carries a committed default; this
          # lets a build override it without one being in the repository. The
          # publishable key is safe to commit -- what was not safe was the
          # wrong project's key being committed, which is why the app now
          # refuses to launch rather than reach a Supabase it was not meant to.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p debug-artifacts
          stem="kyron-${VERSION}+${KYRON_BUILD_NUMBER}-dev"
          out=app/build/app/outputs/flutter-apk
          stage=initialization
          started=$SECONDS
          interrupted=no
          report_interruption() {
            local signal=$1
            local code=143
            if [ "$signal" = INT ]; then code=130; fi
            interrupted=yes
            echo "::error::Android build received $signal during ${stage:-unknown} after $((SECONDS-started)) seconds (exit $code)."
            exit "$code"
          }
          trap 'report_interruption TERM' TERM
          trap 'report_interruption INT' INT
          trap 'status=$?; if [ "$status" -ne 0 ] && [ "$interrupted" != yes ]; then echo "::error::Android build failed during ${stage:-unknown} (exit ${status}) after $((SECONDS-started)) seconds."; fi' EXIT

          build() {
            stage=$1
            shift
            local stage_started=$SECONDS
            echo "::group::Building $stage APKs"
            scripts/android-ci.sh run app flutter build apk --release --no-pub "$@" \
                --build-number "$KYRON_BUILD_NUMBER" \
                ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"} \
                ${GIPHY_API_KEY:+--dart-define=GIPHY_API_KEY="$GIPHY_API_KEY"}
            echo "$stage completed in $((SECONDS-stage_started)) seconds."
            echo "::endgroup::"
          }

          # Remove expected outputs before compiling; never publish stale files.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            rm -f "$out/app-$abi-release.apk"
          done
          build split --split-per-abi --android-project-arg=force-version-code-ignoring-abi=true
          stage=collect-splits
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "$out/app-$abi-release.apk" || { echo "Missing $abi APK."; exit 1; }
            mv "$out/app-$abi-release.apk" "debug-artifacts/${stem}-$abi.apk"
          done

          rm -f "$out/app-release.apk"
          build universal
          stage=collect-universal
          test -f "$out/app-release.apk" || { echo "Missing universal APK."; exit 1; }
          mv "$out/app-release.apk" "debug-artifacts/${stem}-universal.apk"
          stage=artifact-validation
          test "$(find debug-artifacts -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 4
          ls -lh debug-artifacts
          stage=complete
          echo "All four APK variants completed in $((SECONDS-started)) seconds."

      # The checks that would have caught each of these. An APK that is
      # debuggable, or enormous, or signed with a key nobody has seen before
      # builds, uploads and publishes perfectly happily, and then will not
      # install -- and every one of those three shows the reader the same six
      # words, "package appears to be invalid", which point at the file rather
      # than at the cause.
      #
      # The checking is in scripts/check-apks.sh, called by the release
      # workflow too: a check that guards development builds and not releases
      # is one that will be missing the day it matters. What it does and why
      # each part of it is there is written at the top of that file.
      - name: Check the APKs are installable
        working-directory: .
        run: |
          set -euo pipefail
          # Pinned to the key committed at app/android/dev-signing, when that
          # is the key in use: it is the only one whose fingerprint this
          # repository knows. A secret keystore has nothing here to pin to,
          # and everything else about the check still applies.
          if [ "${KYRON_PINNED:-no}" = yes ]; then
            pin=$(tr -d '[:space:]' < app/android/dev-signing/fingerprint.txt)
            test -n "$pin" || {
              echo "app/android/dev-signing/fingerprint.txt is empty."
              exit 1
            }
            scripts/check-apks.sh --build "$KYRON_BUILD_NUMBER" --pin "$pin" debug-artifacts/*.apk
          else
            scripts/check-apks.sh --build "$KYRON_BUILD_NUMBER" debug-artifacts/*.apk
          fi

      # And the bundle for Play, from the same commit and with the same number.
      #
      # Only versioned releases used to make one, so the newest code was never
      # something Play could be given without cutting a version -- a bump, a
      # changelog section, a tag and a public release, to put a build in front
      # of internal testers. Now every development build carries one, and a
      # release is for when there is a version to name.
      #
      # Signed with the upload key, which is what Play requires and what it
      # replaces with the app signing key before anybody installs it. So this
      # changes nothing on anybody's phone: the APKs above are still the
      # development key's, and checked as such before this step rewrites
      # key.properties.
      #
      # Required here, where the secrets are, so a deleted one is a failed
      # build rather than a bundle that quietly stopped appearing. A fork has
      # none of them and gets the APKs.
      - name: Build the Play bundle
        working-directory: .
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          CANONICAL: ${{ github.repository == 'KyronLabs/kyron' }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$GOOGLE_SERVICES_JSON" ]; then
            if [ "$CANONICAL" = true ]; then
              echo "No upload key or no GOOGLE_SERVICES_JSON, so no Play bundle."
              echo "Both are repository secrets; README.md, Builds and releases."
              exit 1
            fi
            echo "::notice::No upload key in this repository, so no Play bundle."
            exit 0
          fi

          # Push is not optional in something going to Play.
          test -f app/android/app/google-services.json

          scripts/write-upload-key.sh
          scripts/android-ci.sh run app flutter build appbundle --release --no-pub \
              --build-number "$KYRON_BUILD_NUMBER" \
              ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"} \
              ${GIPHY_API_KEY:+--dart-define=GIPHY_API_KEY="$GIPHY_API_KEY"}

          src=app/build/app/outputs/bundle/release/app-release.aab
          test -f "$src" || { echo "Missing $src"; exit 1; }
          # No -dev: nothing about it is a development build's but the
          # version name, which is the last release's.
          bundle="debug-artifacts/kyron-${VERSION}+${KYRON_BUILD_NUMBER}.aab"
          mv "$src" "$bundle"
          scripts/check-aab.sh --keystore app/android/upload-keystore.jks \
            --build "$KYRON_BUILD_NUMBER" "$bundle"

      # Keep the files on this runner. Only release assets are published;
      # there is no upload-artifact/download-artifact handoff.
      - name: Verify the complete development release file set
        working-directory: .
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CANONICAL: ${{ github.repository == 'KyronLabs/kyron' }}
        run: |
          set -euo pipefail
          stem="kyron-${VERSION}+${KYRON_BUILD_NUMBER}-dev"
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            test -s "debug-artifacts/${stem}-$abi.apk"
          done
          test "$(find debug-artifacts -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 4
          if [ "$CANONICAL" = true ]; then
            test -s "debug-artifacts/kyron-${VERSION}+${KYRON_BUILD_NUMBER}.aab"
          fi

      # Remove local signing material before the release action executes.
      # The release action receives only the validated output files.
      - name: Remove temporary signing material
        working-directory: .
        if: always()
        run: rm -f app/android/key.properties app/android/dev-keystore.jks app/android/upload-keystore.jks app/android/app/google-services.json

      # A prerelease, so that GitHub's "Latest" is the version that shipped
      # rather than the newest commit. These were published as "Latest" while
      # no versioned release existed, because /releases/latest considers only
      # non-prereleases and answered 404 -- and the comment here said to
      # switch once one did. v0.1.1 does; development build 119 then took
      # "Latest" from it.
      #
      # Tagged and titled with the build number, which is the commit count
      # (scripts/build-number.sh), so the number on the release page is the
      # one in the files and in Play's version code.
      - name: Publish development release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: debug-${{ needs.version.outputs.version }}-${{ needs.version.outputs.build }}
          target_commitish: ${{ github.sha }}
          name: Kyron ${{ needs.version.outputs.version }} development build ${{ needs.version.outputs.build }}
          body: |
            ${{ needs.version.outputs.notes }}

            ---

            A development Android build off `main`, not a versioned release. It is
            compiled in release mode; only the signature is a development one.

            **Android** — take `arm64-v8a` unless you know otherwise; it fits
            essentially every phone sold since about 2015. `universal` works
            anywhere and is roughly twice the size. `x86_64` is for emulators.
            Every APK here is the same build and carries the same version, so
            it does not matter which you try first.

            **Google Play** — the `.aab` is this build for Play, signed with
            the upload key: Play Console → Test and release → Internal
            testing → Create new release. It cannot be installed by hand.
            Its version name is the last release's; its version code is
            100000 plus the build number in its name, and above every build
            before it.

            **Coming from build 78 or earlier, uninstall Kyron first.** Those
            builds were signed with a different key — a new one each time, for
            74 to 77 — and Android will not accept an update whose signature
            is not the one already on the phone. It refuses with *"App not
            installed as package appears to be invalid"*, which sounds like a
            corrupt file and is not. This is the last time: every build from
            79 onwards carries the same key, so they install over each other
            normally.

            Also uninstall first if you have Kyron from the Play Store. These
            are signed with a development key rather than the store one, and
            the two cannot sit side by side.

            If those six words still appear on a clean phone, the download was
            interrupted — check the file is the full size shown here and try
            again on a stable connection.
          prerelease: true
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: debug-artifacts/*
