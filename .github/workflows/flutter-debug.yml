name: Flutter Debug Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  KYRON_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          # Optional. supabase_config.dart carries a committed default; this
          # lets a build override it without one being in the repository. The
          # publishable key is safe to commit -- what was not safe was the
          # wrong project's key being committed, which is why the app now
          # refuses to launch rather than reach a Supabase it was not meant to.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --debug --build-number "$KYRON_BUILD_NUMBER" \
            ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"}

      - name: Rename artifact
        run: cp build/app/outputs/flutter-apk/app-debug.apk "build/app/outputs/flutter-apk/kyron-${{ steps.version.outputs.version }}+${KYRON_BUILD_NUMBER}-debug.apk"

      - name: Upload debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyron-debug-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Published as a normal release, not a prerelease: GitHub's "Latest"
      # badge and /releases/latest only ever consider non-prereleases, so while
      # every build was a prerelease the endpoint returned 404 and no build ever
      # showed as current. make_latest is explicit because tag names sort
      # lexicographically -- debug-0.1.0-9 sorts after debug-0.1.0-20.
      - name: Publish debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ steps.version.outputs.version }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Kyron ${{ steps.version.outputs.version }} debug build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: app/build/app/outputs/flutter-apk/*-debug.apk
