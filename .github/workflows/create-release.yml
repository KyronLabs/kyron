name: Create Versioned Release

on:
  push:
    branches: [main]
    paths:
      - app/pubspec.yaml
      - .github/workflows/create-release.yml
  workflow_dispatch:

permissions:
  contents: write
  # To start the Release workflow on the tag; see the last step.
  actions: write

# Serialize tag creation and release dispatch.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  tag:
    name: Validate the merged version, tag and dispatch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Read the reviewed release version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$/\1/p' app/pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid pubspec version"; exit 1; }
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 && "$(git rev-parse "v$version^{commit}")" == "$GITHUB_SHA" ]]; then
              echo "value=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Version $version already tagged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/changelog.py show "$version" > /dev/null
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The same JDK the release build signs with; the check below reads the
      # key through it.
      - name: Set up Java
        if: steps.version.outputs.value != ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      # Before tagging. Release needs these to sign the bundle and give
      # it push, and it reads them only once the tag exists -- so a missing or
      # mistyped one left a version committed and tagged with nothing built
      # under it. The upload key's fingerprints are public; they go in the
      # run summary to compare with Play Console's upload key certificate.
      - name: Check the release secrets
        if: steps.version.outputs.value != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          fingerprints=$(scripts/check-release-secrets.sh)
          {
            echo "### Upload key"
            echo
            echo "Play Console → Test and release → App integrity → Upload key"
            echo "certificate should show the same."
            echo
            echo '```'
            echo "$fingerprints"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the reviewed release commit
        if: steps.version.outputs.value != ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Kyron v$VERSION"
          git push origin "refs/tags/v$VERSION"

      # The tag alone starts nothing. It was pushed with this workflow's own
      # GITHUB_TOKEN, and GitHub runs no workflow for an event that token
      # caused -- so the Release workflow's `on: push: tags` never fires for
      # it, and the version would be bumped and tagged with nothing built.
      # A dispatch is the documented exception, so the release is asked for
      # by name, on the tag just pushed. scripts/check-workflows.py holds
      # this in place.
      - name: Start the release build
        if: steps.version.outputs.value != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh workflow run flutter-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "v${VERSION}"
          echo "Release started for v${VERSION}: the Android bundle and APKs" \
            "will be on the GitHub release when it finishes." >> "$GITHUB_STEP_SUMMARY"
