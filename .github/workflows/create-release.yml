name: Create Versioned Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged into main (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write
  # To start the Release workflow on the tag; see the last step.
  actions: write

# Serialize tag creation and release dispatch.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  tag:
    name: Validate the merged version, tag and dispatch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate the merged release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Enter a release version in X.Y.Z format."
            exit 1
          fi
          current=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$/\1/p' app/pubspec.yaml)
          if [[ "$current" != "$VERSION" ]]; then
            echo "::error::The version must match the pubspec on the dispatched main commit."
            exit 1
          fi
          python3 scripts/changelog.py show "$VERSION" > /dev/null

      # The same JDK the release build signs with; the check below reads the
      # key through it.
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      # Also before the bump. Release needs these to sign the bundle and give
      # it push, and it reads them only once the tag exists -- so a missing or
      # mistyped one left a version committed and tagged with nothing built
      # under it. The upload key's fingerprints are public; they go in the
      # run summary to compare with Play Console's upload key certificate.
      - name: Check the release secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          fingerprints=$(scripts/check-release-secrets.sh)
          {
            echo "### Upload key"
            echo
            echo "Play Console → Test and release → App integrity → Upload key"
            echo "certificate should show the same."
            echo
            echo '```'
            echo "$fingerprints"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the reviewed release commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::$tag already points to a different commit."
              exit 1
            fi
          else
            git tag -a "$tag" -m "Kyron $tag"
            git push origin "refs/tags/$tag"
          fi

      # The tag alone starts nothing. It was pushed with this workflow's own
      # GITHUB_TOKEN, and GitHub runs no workflow for an event that token
      # caused -- so the Release workflow's `on: push: tags` never fires for
      # it, and the version would be bumped and tagged with nothing built.
      # A dispatch is the documented exception, so the release is asked for
      # by name, on the tag just pushed. scripts/check-workflows.py holds
      # this in place.
      - name: Start the release build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run flutter-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "v${VERSION}"
          echo "Release started for v${VERSION}: the Android bundle and APKs" \
            "will be on the GitHub release when it finishes." >> "$GITHUB_STEP_SUMMARY"
