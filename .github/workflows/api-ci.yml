name: API CI

# The Flutter workflows are path-filtered to app/**, so nothing ran against
# api/ at all: no build, no typecheck, no tests. Everything below was being
# checked by hand, or not at all.
on:
  push:
    branches: [main, dev]
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

# Superseded by the next push to the same branch or pull request. A run
# against a commit nobody is looking at any more is a queue slot the current
# one is waiting behind.
concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test the API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Matches NODE_VERSION in api/Dockerfile, so CI and the deployed image
      # do not diverge on runtime behaviour.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Prisma Client is generated, never committed. tsc and jest both fail
      # without it, so this has to come before either.
      # Fails on a critical advisory in what ships. High ones are reported
      # here but not fatal: the remaining ones are in the Prisma CLI, which
      # runs at deploy time and never handles a request.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # jest's rootDir is src and its testRegex only matches *.spec.ts, so this
      # runs the unit specs. test/app.e2e-spec.ts boots the whole AppModule and
      # needs a live Postgres plus JWT_SECRET, so it is deliberately excluded
      # rather than being made to fail here.
      - name: Unit tests
        run: npm test

      # Blocking. The backlog that made this advisory when the workflow landed
      # (31 errors) is cleared; 6 no-unsafe-argument warnings remain and eslint
      # does not fail on warnings, so this gates regressions without failing on
      # the known remainder.
      - name: Lint
        run: npm run lint

  database-tests:
    name: Database tests against Postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # The *.db.spec files skip themselves unless a database is given, so until
    # this job they ran nowhere: a broken lock, refill or visibility rule would
    # have passed CI. Postgres 16, like Supabase's.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyron
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: kyron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyron"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://kyron@localhost:5432/kyron_test
      MODERATION_TEST_DATABASE_URL: postgresql://kyron@localhost:5432/kyron_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      # The migrations grant and revoke on Supabase's roles and call its auth
      # helpers. A bare Postgres has neither, so they are stood in for here:
      # the grants then apply to roles nothing uses, which is all a test needs.
      - name: Stand in for Supabase's roles
        run: |
          for role in anon authenticated service_role authenticator supabase_admin; do
            psql "$DATABASE_URL" -qc "create role $role"
          done
          psql "$DATABASE_URL" -q <<'SQL'
          create schema auth;
          create function auth.uid() returns uuid language sql as 'select null::uuid';
          create function auth.role() returns text language sql as 'select null::text';
          create schema extensions;
          SQL

      - name: Apply migrations
        run: npx prisma migrate deploy

      # One file at a time. They share this one database, and a spec that
      # pages through the whole feed (feed.impressions.db.spec) saw another
      # spec's posts deleted halfway through its pages and failed, about one
      # run in four, for nothing it had done. In parallel they took ~6s, in
      # band ~9s.
      - name: Database tests
        run: npx jest db.spec --runInBand
