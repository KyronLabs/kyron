name: Flutter Android Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  KYRON_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate tag matches pubspec version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pubspec_version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          tag_version="${RELEASE_TAG#v}"
          test "$pubspec_version" = "$tag_version" || {
            echo "Tag $RELEASE_TAG does not match pubspec version $pubspec_version"
            exit 1
          }
          echo "version=$pubspec_version" >> "$GITHUB_OUTPUT"

      - name: Decode Android signing key
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ANDROID_KEYSTORE_BASE64 is required for a distributable release."
            exit 1
          }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: Build release APK
        env:
          # Optional. supabase_config.dart carries a committed default; this
          # lets a build override it without one being in the repository. The
          # publishable key is safe to commit -- what was not safe was the
          # wrong project's key being committed, which is why the app now
          # refuses to launch rather than reach a Supabase it was not meant to.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --build-number "$KYRON_BUILD_NUMBER" \
            ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"}

      - name: Build release App Bundle
        env:
          # Optional. supabase_config.dart carries a committed default; this
          # lets a build override it without one being in the repository. The
          # publishable key is safe to commit -- what was not safe was the
          # wrong project's key being committed, which is why the app now
          # refuses to launch rather than reach a Supabase it was not meant to.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release --build-number "$KYRON_BUILD_NUMBER" \
            ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"}

      - name: Rename release artifacts
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ env.KYRON_BUILD_NUMBER }}
        run: |
          mkdir -p release-artifacts
          cp app/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/kyron-${VERSION}+${BUILD_NUMBER}-release.apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "release-artifacts/kyron-${VERSION}+${BUILD_NUMBER}-release.aab"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
