name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # How "Create Versioned Release" starts it: that workflow pushes the tag
  # with its own token, and a push made with that token starts nothing. Run by
  # hand, pick the version tag under "Use workflow from", not a branch.
  workflow_dispatch:

permissions:
  contents: write

# A tag is pushed once, but a re-run or a retag should not race a half-finished
# publish. Never cancelled: a release part-way through uploading is worse than
# one that finishes and is then superseded.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The build number is worked out once, in the checks job, and every job after
# it reads that one answer -- so the APKs, the bundle and the Windows zip out of
# one tag carry the same number. It is the tag's commit count, not this
# workflow's run number: the development builds count the same way, so a
# release's bundle and theirs are one rising sequence in Play. Why that matters
# is in scripts/build-number.sh.

jobs:
  # Everything that does not need a platform toolchain, once, before either
  # build starts. A tag can point at any commit -- including one that never saw
  # CI -- so this is the gate, and failing it costs thirty seconds rather than
  # two platform builds.
  checks:
    name: Check the tag and the code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.build.outputs.build }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          # The whole history, which the build number is counted from.
          fetch-depth: 0

      - name: Number the build
        id: build
        working-directory: .
        run: echo "build=$(scripts/build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate tag matches pubspec version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Dispatched by hand, this can be pointed at a branch. Say that
          # plainly rather than "Tag main does not match pubspec version".
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "Release builds a version tag, and this run is on $GITHUB_REF."
              echo "Run it from a vX.Y.Z tag, or use Create Versioned Release."
              exit 1
              ;;
          esac
          pubspec_version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          tag_version="${RELEASE_TAG#v}"
          test "$pubspec_version" = "$tag_version" || {
            echo "Tag $RELEASE_TAG does not match pubspec version $pubspec_version"
            exit 1
          }
          echo "version=$pubspec_version" >> "$GITHUB_OUTPUT"

      # Read here rather than at publish time, so a release with no notes fails
      # before anything is built rather than after both platforms have run.
      - name: Require notes for this version
        working-directory: .
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/changelog.py show "$VERSION" > /dev/null

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

  android:
    name: Build the Android release
    needs: checks
    runs-on: ubuntu-latest
    env:
      KYRON_BUILD_NUMBER: ${{ needs.checks.outputs.build }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      # Pinned rather than left to whatever the runner image ships. The Android
      # Gradle Plugin and Kotlin target 17 (app/android/app/build.gradle.kts),
      # and a runner image bumping its default JDK would otherwise break a
      # release build with no change on our side.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Required, not optional. Without it the Google services Gradle plugin
      # is skipped, the APK builds cleanly, and every install is unreachable
      # while the app is closed -- with nothing in the build output saying so.
      # A release is the wrong place to find that out.
      - name: Write the Firebase configuration
        working-directory: .
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || {
            echo "GOOGLE_SERVICES_JSON is required: without it this release"
            echo "would ship with no push notifications. Add the contents of"
            echo "app/android/app/google-services.json as a repository secret."
            echo "See docs/PUSH.md."
            exit 1
          }
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json
          # Proves it is the file rather than an empty or truncated secret,
          # before Gradle reaches it and says something less useful.
          python3 -c "import json,sys; json.load(open('app/android/app/google-services.json'))" || {
            echo "GOOGLE_SERVICES_JSON is not valid JSON."
            exit 1
          }

      # The same script the development builds' Play bundle uses. It used to
      # be written here inline, with the passwords pasted into an unquoted
      # heredoc -- where a `$` or a backtick in one would have been expanded
      # by the shell and the build would have failed on a password that was
      # right.
      - name: Decode Android signing key
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/write-upload-key.sh

      # One `flutter build` per architecture, rather than `--split-per-abi`.
      # All of them are published: the per-architecture ones are roughly a
      # third the size, and the universal one is what to reach for when you do
      # not know which architecture a handset is.
      #
      # Splitting would make the Flutter Gradle Plugin rewrite each split's
      # versionCode to `abi * 1000 + build` and leave the universal APK on the
      # lowest of them, so the second file somebody tried would be refused as
      # a downgrade -- reported by OEM installers as "App not installed as
      # package appears to be invalid". app/android/app/build.gradle.kts
      # refuses the flag outright; this is the shape that works.
      - name: Build every APK
        working-directory: .
        env:
          # Optional. supabase_config.dart carries a committed default; this
          # lets a build override it without one being in the repository. The
          # publishable key is safe to commit -- what was not safe was the
          # wrong project's key being committed, which is why the app now
          # refuses to launch rather than reach a Supabase it was not meant to.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          stem="kyron-${VERSION}+${KYRON_BUILD_NUMBER}"
          out=app/build/app/outputs/flutter-apk/app-release.apk

          # Every build writes to the same path, so each one is collected and
          # removed before the next starts. No --target-platform is what
          # makes the last one universal.
          build() {
            local name=$1
            shift
            ( cd app && flutter build apk --release "$@" \
                --build-number "$KYRON_BUILD_NUMBER" \
                ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"} \
                ${GIPHY_API_KEY:+--dart-define=GIPHY_API_KEY="$GIPHY_API_KEY"} )
            # Missing means the build claimed success and produced nothing,
            # which is a broken release rather than a smaller one.
            test -f "$out" || { echo "Missing $out after the $name build."; exit 1; }
            mv "$out" "release-artifacts/${stem}-${name}.apk"
          }

          build arm64-v8a   --target-platform android-arm64
          build armeabi-v7a --target-platform android-arm
          build x86_64      --target-platform android-x64
          build universal

      - name: Build release App Bundle
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          flutter build appbundle --release \
            --build-number "$KYRON_BUILD_NUMBER" \
            ${SUPABASE_ANON_KEY:+--dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"} \
                ${GIPHY_API_KEY:+--dart-define=GIPHY_API_KEY="$GIPHY_API_KEY"}

      # The APKs are already collected; this is the bundle, which is what
      # goes to the Play Store and is not installable by hand. Checked for
      # the upload key's signature and its version code before it goes
      # anywhere: Play refuses either wrong, after the upload.
      - name: Collect the bundle
        working-directory: .
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          src=app/build/app/outputs/bundle/release/app-release.aab
          test -f "$src" || { echo "Missing $src"; exit 1; }
          bundle="release-artifacts/kyron-${VERSION}+${KYRON_BUILD_NUMBER}.aab"
          cp "$src" "$bundle"
          scripts/check-aab.sh --keystore app/android/upload-keystore.jks \
            --build "$KYRON_BUILD_NUMBER" "$bundle"
          ls -lh release-artifacts

      # The same check the development builds get, for the same reason: a
      # release APK that is debuggable, truncated or signed with a key that
      # is not the release key reports "App not installed as package appears
      # to be invalid" and says nothing about which of the three it was.
      #
      # No --pin: the release key is a secret, so there is no fingerprint in
      # the repository to pin it to. Everything else applies, including that
      # all four APKs have to carry the same certificate as each other.
      - name: Check the APKs are installable
        working-directory: .
        run: scripts/check-apks.sh release-artifacts/*.apk

      - name: Hand the Android build to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build the Windows release
    needs: checks
    runs-on: windows-latest
    env:
      KYRON_BUILD_NUMBER: ${{ needs.checks.outputs.build }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the Windows app
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A plain array passed to a native command, which PowerShell expands
          # one element per argument. Not splatted with @: that is for cmdlets,
          # and only recent PowerShell extends it to native commands. Not
          # $args either -- that name is already PowerShell's.
          $flags = @('--release', '--build-number', $env:KYRON_BUILD_NUMBER)
          if ($env:SUPABASE_ANON_KEY) {
            $flags += "--dart-define=SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY"
          }
          if ($env:GIPHY_API_KEY) {
            $flags += "--dart-define=GIPHY_API_KEY=$env:GIPHY_API_KEY"
          }
          flutter build windows $flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A Windows app is a folder, not a file: the executable needs
      # flutter_windows.dll, every plugin's DLL and the whole data directory
      # beside it, and none of that is inside the .exe. So the zip carries the
      # folder, and it has a name inside it -- unzipping a bare pile of DLLs
      # into Downloads is how that ends badly.
      #
      # The Release directory is located rather than spelled out: Flutter moved
      # it from build/windows to build/windows/x64 once already, and a
      # hard-coded path that stops matching would silently zip nothing.
      - name: Package the Windows app
        working-directory: .
        shell: pwsh
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          & ./scripts/package-windows.ps1 `
            -Stem "kyron-$env:VERSION+$env:KYRON_BUILD_NUMBER" `
            -OutputDirectory release-artifacts

      - name: Hand the Windows build to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  # A release's bundle goes on to Play's internal testing track once it has
  # passed scripts/check-aab.sh, so testers get each version without anybody
  # downloading it from here and uploading it to Play Console by hand. Only
  # an app's very first bundle has to go through Play Console.
  #
  # Releases only, deliberately. A development build's bundle carries the
  # last release's version name, so in Play two different builds would both
  # read "0.1.3", and testers would get every merge to main. What reaches
  # testers is what somebody chose to cut as a version; a development bundle
  # can still be uploaded by hand from its GitHub release.
  #
  # Its own job, so a Play outage or a revoked key fails this and not the
  # GitHub release, which is published either way. And the bundle it sends
  # is the one the android job built and checked, out of that job's
  # artifact -- never a second build of the same tag.
  #
  # Needs the PLAY_SERVICE_ACCOUNT_JSON secret: a service account allowed to
  # release to testing tracks (README.md, Google Play). Without it the job
  # says so and stops, so a fork, or this repository before it is set up,
  # releases exactly as it did.
  play:
    name: Send the bundle to Play internal testing
    needs: [checks, android]
    runs-on: ubuntu-latest
    env:
      KYRON_BUILD_NUMBER: ${{ needs.checks.outputs.build }}
    steps:
      - name: Check Play is set up here
        id: ready
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret, so this bundle was not sent to Play. README.md, Google Play, says how to set it up."
            echo "send=no" >> "$GITHUB_OUTPUT"
          else
            echo "send=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.ready.outputs.send == 'yes'
        uses: actions/checkout@v4

      - name: Collect the checked bundle
        if: steps.ready.outputs.send == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: android
          path: incoming

      # This version's changelog section; play-upload.py cuts it to Play's
      # 500 characters.
      - name: Write the release notes
        if: steps.ready.outputs.send == 'yes'
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: python3 scripts/changelog.py show "$VERSION" > play-notes.txt

      - name: Send it to the internal testing track
        if: steps.ready.outputs.send == 'yes'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          bundle="incoming/kyron-${VERSION}+${KYRON_BUILD_NUMBER}.aab"
          test -f "$bundle" || { echo "The android job's artifact has no $bundle."; exit 1; }
          python3 scripts/play-upload.py --package so.kyron.app --track internal \
            --name "${VERSION}" --notes-file play-notes.txt "$bundle"

  # One release, published once, with both platforms in it. Separate because
  # the two builds run on different operating systems and a release that
  # appeared after the first one finished would be missing the other.
  publish:
    name: Publish the release
    needs: [checks, android, windows]
    runs-on: ubuntu-latest
    env:
      KYRON_BUILD_NUMBER: ${{ needs.checks.outputs.build }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Collect both platforms
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Gather them into one directory
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find incoming -type f -exec mv {} release-artifacts/ \;
          ls -lh release-artifacts

          # Both platforms, or it is not this release. A download-artifact that
          # quietly returned nothing would otherwise publish an Android-only
          # release under a version that promised both.
          test -f "release-artifacts/kyron-${VERSION}+${KYRON_BUILD_NUMBER}-windows-x64.zip"
          test -f "release-artifacts/kyron-${VERSION}+${KYRON_BUILD_NUMBER}-arm64-v8a.apk"
          test -f "release-artifacts/kyron-${VERSION}+${KYRON_BUILD_NUMBER}.aab"

      - name: Read release notes from the changelog
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          {
            echo 'notes<<KYRON_NOTES_EOF'
            # GitHub refuses a release body over 125,000 characters, at the
            # end of the run. The section is cut between entries to leave
            # room for the install notes below it.
            python3 scripts/changelog.py show "$VERSION" --max 120000
            echo 'KYRON_NOTES_EOF'
          } >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Named, not inferred from the event: started by a dispatch, the
          # run's ref is still the tag, but saying so costs nothing.
          tag_name: ${{ github.ref_name }}
          name: Kyron ${{ needs.checks.outputs.version }}
          # The changelog, not GitHub's generated notes. Generated notes cover
          # everything since the previous tag, and the previous tag is nearly
          # always a debug build -- so a versioned release described whatever
          # happened since the last push to main, which is usually nothing.
          body: |
            ${{ env.notes }}

            ---

            ### Windows

            `kyron-*-windows-x64.zip`. Unzip it anywhere and run `Kyron.exe`
            inside the `Kyron` folder — keep the folder together, the DLLs
            beside the executable are the app. Windows will warn that the
            publisher is unknown, because the build is not code-signed; More
            info → Run anyway.

            ### Android

            `arm64-v8a` for any phone from roughly 2015 onwards.
            `armeabi-v7a` for older 32-bit devices, `x86_64` for emulators. The
            `universal` build works everywhere and is about three times the
            size. The `.aab` is for the Play Store and is not installable by
            hand.
          generate_release_notes: false
          make_latest: true
          files: release-artifacts/*
