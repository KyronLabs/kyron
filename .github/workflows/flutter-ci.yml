name: Flutter CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'app/**'
      - 'CHANGELOG.md'
      - 'scripts/changelog.py'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'CHANGELOG.md'
      - 'scripts/changelog.py'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

# Superseded by the next push to the same branch or pull request. A run
# against a commit nobody is looking at any more is a queue slot the current
# one is waiting behind.
concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Checks the whole tree rather than a diff. The previous version derived
      # its file list from a diff range that differed between events -- a push
      # saw only that push's files, a pull request saw everything since the
      # base -- so the same commit could pass on one and fail on the other, and
      # a file nobody touched was never examined. That was survivable only
      # because most of the tree was unformatted anyway; now that it is clean,
      # checking everything is both simpler and stricter.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # The legacy app currently has warning-level lints; keep errors fatal while allowing CI to report warnings.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      # test/format-vectors.json is a vendored copy of the spec that lives in
      # KyronLabs/kyron-lenses. Lens.tryParse here and lens.py there are two
      # implementations of one set of rules, and nothing about being in
      # separate repositories makes them agree -- so if a rule is added there
      # and not here, a lens passes their CI, gets published, and is silently
      # dropped by this app.
      #
      # This fails the build when the published spec and the vendored copy
      # differ. The fix is to copy the new one in and make the vectors test
      # pass, in that order.
      #
      # A fetch that does not answer is a Pages hiccup rather than a spec
      # change, and is reported without failing: the vectors themselves still
      # ran above.
      - name: The shared format spec has not moved on without us
        run: |
          url=https://kyronlabs.github.io/kyron-lenses/format-vectors.json
          if ! curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/canonical.json; then
            echo "::warning::Could not reach $url. The vendored spec was not compared."
            exit 0
          fi
          if ! diff -u test/format-vectors.json /tmp/canonical.json; then
            echo "::error::The format spec in kyron-lenses differs from the copy in test/format-vectors.json."
            echo "Copy the published file over it, then run: flutter test test/lens_format_vectors_test.dart"
            exit 1
          fi
          echo "The vendored spec matches the published one."

  # A separate job, because it has nothing to do with Flutter and should not
  # wait behind an Android toolchain to tell you a heading is malformed.
  changelog:
    name: Check the changelog parses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The release workflow reads the published notes out of this file, and
      # the release-cutting workflow refuses to tag while Unreleased is empty.
      # Both would fail at the worst moment -- mid-release -- if a heading were
      # malformed, so it is checked on every change instead.
      - name: Parse CHANGELOG.md
        run: python3 scripts/changelog.py unreleased
