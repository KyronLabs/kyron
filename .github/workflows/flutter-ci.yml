name: Flutter CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting of changed Dart files
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            diff_range="origin/${GITHUB_BASE_REF}...HEAD"
          elif [[ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            diff_range="$GITHUB_EVENT_BEFORE $GITHUB_SHA"
          else
            diff_range="HEAD^ HEAD"
          fi

          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMRT $diff_range -- '*.dart' | sed 's#^app/##' | grep -E '^(lib|test)/' || true)
          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed Dart files require formatting validation."
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${changed_files[@]}"

      - name: Analyze
        # The legacy app currently has warning-level lints; keep errors fatal while allowing CI to report warnings.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test
