name: Flutter CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'app/**'
      - 'CHANGELOG.md'
      - 'scripts/**'
      # Every workflow, not just this one: the release wiring is checked below,
      # and a filter naming only this file meant a change to the release
      # workflow ran nothing at all.
      - '.github/workflows/**'
  workflow_call:
    secrets:
      DESIGN_SYSTEM_READ_TOKEN:
        description: Read-only access to KyronLabs/design-system for trusted builds
        required: false

permissions:
  contents: read

# Superseded by the next push to the same branch or pull request. A run
# against a commit nobody is looking at any more is a queue slot the current
# one is waiting behind.
concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned, not "whatever stable shipped last night": Flutter 3.50
          # raised Flutter's minimum Gradle to 9.3.1, and this project's
          # wrapper is on 8.14 (app/android/gradle/wrapper), where every
          # Android build dies applying the Flutter Gradle plugin at
          # `flutter build`. Move this pin and the Android toolchain
          # (gradle-wrapper.properties, AGP and Kotlin in settings.gradle.kts)
          # up together, never apart.
          flutter-version: '3.47.9'
          channel: stable
          cache: true
          pub-cache: false

      - name: Install dependencies
        env:
          DESIGN_SYSTEM_READ_TOKEN: ${{ secrets.DESIGN_SYSTEM_READ_TOKEN }}
        run: bash ../scripts/flutter-pub-get-ci.sh

      # Checks the whole tree rather than a diff. The previous version derived
      # its file list from a diff range that differed between events -- a push
      # saw only that push's files, a pull request saw everything since the
      # base -- so the same commit could pass on one and fail on the other, and
      # a file nobody touched was never examined. That was survivable only
      # because most of the tree was unformatted anyway; now that it is clean,
      # checking everything is both simpler and stricter.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # The legacy app currently has warning-level lints; keep errors fatal while allowing CI to report warnings.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      # test/format-vectors.json is a vendored copy of the spec that lives in
      # KyronLabs/kyron-lenses. Lens.tryParse here and lens.py there are two
      # implementations of one set of rules, and nothing about being in
      # separate repositories makes them agree -- so if a rule is added there
      # and not here, a lens passes their CI, gets published, and is silently
      # dropped by this app.
      #
      # This fails the build when the published spec and the vendored copy
      # differ. The fix is to copy the new one in and make the vectors test
      # pass, in that order.
      #
      # A fetch that does not answer is a Pages hiccup rather than a spec
      # change, and is reported without failing: the vectors themselves still
      # ran above.
      - name: The shared format spec has not moved on without us
        run: |
          url=https://kyronlabs.github.io/kyron-lenses/format-vectors.json
          if ! curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/canonical.json; then
            echo "::warning::Could not reach $url. The vendored spec was not compared."
            exit 0
          fi
          if ! diff -u test/format-vectors.json /tmp/canonical.json; then
            echo "::error::The format spec in kyron-lenses differs from the copy in test/format-vectors.json."
            echo "Copy the published file over it, then run: flutter test test/lens_format_vectors_test.dart"
            exit 1
          fi
          echo "The vendored spec matches the published one."

  # A separate job, because it has nothing to do with Flutter and should not
  # wait behind an Android toolchain to tell you a heading is malformed.
  changelog:
    name: Check the changelog and the release wiring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release workflow reads the published notes out of this file, and
      # would fail at the worst moment -- mid-release -- if a heading were
      # malformed, so it is checked on every change instead. Nothing written
      # under Unreleased is fine: the release says "Bug fixes and performance
      # improvements." (scripts/changelog.py, "When nothing was written").
      - name: Parse CHANGELOG.md
        run: |
          python3 scripts/changelog.py unreleased
          # And what Play will say for it, so a What's new note too long for
          # the store fails here rather than at the upload.
          python3 scripts/changelog.py store Unreleased

      # Same reasoning, one level up. A release is meant to carry its checked
      # Android outputs together, with one build number and a publish job that
      # waits for them. Checked here so workflow wiring errors are caught on
      # the pull request rather than during a release.
      - name: Check the release wiring
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-workflows.py

      # The reader that check stands on. It takes the signing certificate out
      # of the APK Signing Block, and it replaced a sed pattern over
      # apksigner's output that a new build-tools version renamed out from
      # under it -- so it is tested against APKs built here and signed all
      # three of the ways Android defines. Standard library only: no SDK, no
      # JDK, nothing from pip.
      - name: Check the APK certificate reader
        run: python3 scripts/test_apk_certificate.py

      - name: Check private publication audit tooling on synthetic history
        run: python3 scripts/test_public_release_audit.py

      # And the one scripts/check-aab.sh stands on: the version code inside
      # a Play bundle, read out of aapt2's protobuf manifest, which is
      # compared with the build number before anything is published.
      - name: Check the bundle manifest reader
        run: python3 scripts/test_aab_manifest.py

      # And the Play upload, which runs only where the Play key is -- never
      # on a pull request -- so this is the only place it is exercised
      # before the day it matters. Against a fake Play, standard library
      # only.
      - name: Check the Play upload
        run: python3 scripts/test_play_upload.py

      # And what Play's "What's new" says: the changelog turned into plain
      # text, within 500 characters, for every release there has been.
      - name: Check the store notes
        run: python3 scripts/test_changelog.py
