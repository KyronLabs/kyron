name: Flutter CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'app/**'
      - 'CHANGELOG.md'
      - 'scripts/**'
      # Every workflow, not just this one: the release wiring is checked below,
      # and a filter naming only this file meant a change to the release
      # workflow ran nothing at all.
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/**'
      - 'CHANGELOG.md'
      - 'scripts/**'
      # Every workflow, not just this one: the release wiring is checked below,
      # and a filter naming only this file meant a change to the release
      # workflow ran nothing at all.
      - '.github/workflows/**'

permissions:
  contents: read

# Superseded by the next push to the same branch or pull request. A run
# against a commit nobody is looking at any more is a queue slot the current
# one is waiting behind.
concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Checks the whole tree rather than a diff. The previous version derived
      # its file list from a diff range that differed between events -- a push
      # saw only that push's files, a pull request saw everything since the
      # base -- so the same commit could pass on one and fail on the other, and
      # a file nobody touched was never examined. That was survivable only
      # because most of the tree was unformatted anyway; now that it is clean,
      # checking everything is both simpler and stricter.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # The legacy app currently has warning-level lints; keep errors fatal while allowing CI to report warnings.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      # test/format-vectors.json is a vendored copy of the spec that lives in
      # KyronLabs/kyron-lenses. Lens.tryParse here and lens.py there are two
      # implementations of one set of rules, and nothing about being in
      # separate repositories makes them agree -- so if a rule is added there
      # and not here, a lens passes their CI, gets published, and is silently
      # dropped by this app.
      #
      # This fails the build when the published spec and the vendored copy
      # differ. The fix is to copy the new one in and make the vectors test
      # pass, in that order.
      #
      # A fetch that does not answer is a Pages hiccup rather than a spec
      # change, and is reported without failing: the vectors themselves still
      # ran above.
      - name: The shared format spec has not moved on without us
        run: |
          url=https://kyronlabs.github.io/kyron-lenses/format-vectors.json
          if ! curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/canonical.json; then
            echo "::warning::Could not reach $url. The vendored spec was not compared."
            exit 0
          fi
          if ! diff -u test/format-vectors.json /tmp/canonical.json; then
            echo "::error::The format spec in kyron-lenses differs from the copy in test/format-vectors.json."
            echo "Copy the published file over it, then run: flutter test test/lens_format_vectors_test.dart"
            exit 1
          fi
          echo "The vendored spec matches the published one."

  # Nothing has ever compiled the Windows runner.
  #
  # analyze-and-test runs on Ubuntu and checks Dart, which is every platform at
  # once and none of them: the runner is C++, its plugin registrant is
  # generated per platform, and neither is Dart. So the window kept its
  # template title, the executable kept com.example in its version block, and
  # the taskbar kept the Flutter logo -- for months, through a CI that was
  # green the whole time, because none of it is anything Dart can see.
  #
  # A debug build, not a release one: this is here to compile the C++ and
  # resolve the Windows half of every plugin, and a release build spends
  # several more minutes to prove the same thing.
  windows:
    name: Build the Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Release rather than debug, which costs a couple of minutes and buys
      # two things: the zip below is one somebody can actually run -- a debug
      # Windows build needs the Visual C++ debug runtime, which only machines
      # with Visual Studio have -- and this is the same build the release
      # workflow makes, so it is the release path being checked rather than a
      # near neighbour of it.
      - name: Build
        run: flutter build windows --release

      # The runner is configured in files no test can reach from Ubuntu, and a
      # wrong one of these fails nothing -- it just ships. So the build says
      # out loud what it produced.
      - name: Report what was built
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter kyron.exe build/windows |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "No kyron.exe was produced. BINARY_NAME in windows/CMakeLists.txt?"
            exit 1
          }
          $info = $exe.VersionInfo
          Write-Host "built      : $($exe.FullName)"
          Write-Host "product    : $($info.ProductName)"
          Write-Host "company    : $($info.CompanyName)"
          if ($info.CompanyName -like "*com.example*") {
            Write-Error "The executable still says com.example."
            exit 1
          }

      # The same script both release workflows package with. Run here so the
      # packaging a release depends on has already worked on every pull
      # request, rather than being first exercised by a release.
      - name: Package the Windows app
        working-directory: .
        shell: pwsh
        run: |
          & ./scripts/package-windows.ps1 `
            -Stem "kyron-ci-${{ github.run_number }}" `
            -OutputDirectory ci-artifacts

      # So a Windows build of any branch can be downloaded and tried without
      # cutting a release or owning a Windows machine to build on.
      - name: Upload the Windows app
        uses: actions/upload-artifact@v4
        with:
          name: kyron-windows-${{ github.run_number }}
          path: ci-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  # A separate job, because it has nothing to do with Flutter and should not
  # wait behind an Android toolchain to tell you a heading is malformed.
  changelog:
    name: Check the changelog and the release wiring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The release workflow reads the published notes out of this file, and
      # the release-cutting workflow refuses to tag while Unreleased is empty.
      # Both would fail at the worst moment -- mid-release -- if a heading were
      # malformed, so it is checked on every change instead.
      - name: Parse CHANGELOG.md
        run: python3 scripts/changelog.py unreleased

      # Same reasoning, one level up. A release is meant to carry Windows and
      # Android together, which is two build jobs, one build number and a
      # publish job that waits for both -- and none of those failing is
      # something a workflow file failing to parse would catch. Checked here so
      # it is found on the pull request rather than by half a release.
      - name: Check the release wiring
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-workflows.py
