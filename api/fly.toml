# fly.toml app configuration file generated for kyron on 2026-08-30T09:23:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kyron'
primary_region = 'fra'

[deploy]
  release_command = 'npx prisma migrate deploy'
  strategy = 'rolling'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 3000
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
