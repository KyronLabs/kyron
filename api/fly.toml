# fly.toml app configuration file generated for kyron on 2026-08-30T18:31:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kyron'
primary_region = 'nrt'

[build]

[deploy]
  strategy = 'rolling'
  release_command = "sh -c 'export DATABASE_URL=\"$DATABASE_URL\" && npx prisma db push --accept-data-loss'"

# The app reads PORT (main.ts falls back to 3000 only if it is unset). Setting
# it here alongside internal_port keeps the listener and the proxy on the same
# number by construction -- they had drifted to 3000 and 8080 respectively,
# which Fly reported as "instance refused connection. is your app listening on
# 0.0.0.0:8080?" while the app logged that it was listening on 0.0.0.0:3000.
# 8080 rather than 3000 because that is Fly's default and what the deployed
# proxy already expected.
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
