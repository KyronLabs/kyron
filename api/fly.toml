# fly.toml app configuration file generated for kyron on 2026-08-30T10:03:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kyron'
primary_region = 'fra'

[build]

[deploy]
  strategy = 'rolling'
  release_command = "sh -c 'export DATABASE_URL=\"$DATABASE_URL\" && npx prisma db push --accept-data-loss'"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
