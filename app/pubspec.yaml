name: kyron_app
description: Kyron mobile client (Android-focused auth MVP).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The design system, consumed rather than copied. app/lib/theme/app_theme.dart
  # was a hand-written near-duplicate that had drifted into its own vocabulary;
  # a git dependency makes that impossible to repeat.
  kyron_design_system:
    git:
      url: https://github.com/KyronLabs/design-system.git
      path: flutter
      ref: main

  flutter_secure_storage: ^9.2.4
  flutter_riverpod: ^3.0.3 
  flutter_svg: ^2.0.10
  dio: ^5.4.0
  supabase_flutter: ^2.8.0
  json_annotation: ^4.9.0
  validators: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  image_picker: ^1.2.1
  sqflite: ^2.4.0
  path: ^1.9.0
  emoji_picker_flutter: ^4.4.0
  characters: ^1.3.0
  shared_preferences: ^2.5.2
  http: ^1.6.0
  html: ^0.15.6
  iconsax_flutter: ^1.0.1
  flutter_slidable: ^3.0.0
  shimmer: ^3.0.0
  url_strategy: ^0.3.0

  # Attachments. video_player for a clip in the feed and the viewer,
  # photo_view for pinch-to-zoom on an image, share_plus to hand one to
  # another app. Without these the media viewer is a picture you cannot
  # zoom, a video you cannot play and a Share button that does nothing.
  video_player: ^2.9.2
  photo_view: ^0.15.0
  share_plus: ^10.1.2

  # The About screen reports the running build and clears the on-device cache.
  # Both were previously invented: the version was the literal string "1.0.0"
  # and the cache size was a random number between 10 and 50 MB.
  package_info_plus: ^8.0.0
  path_provider: ^2.1.4
  visibility_detector: ^0.4.0+2
  record: ^6.2.1
  just_audio: ^0.10.6
  get_thumbnail_video: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.9.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logo.svg
    - lib/assets/google.svg

fonts:
  - family: Inter
    fonts:
      - asset: fonts/Inter-Regular.ttf
        weight: 400
      - asset: fonts/Inter-Medium.ttf
        weight: 500
      - asset: fonts/Inter-Semibold.ttf
        weight: 600
      - asset: fonts/Inter-Bold.ttf
        weight: 700
